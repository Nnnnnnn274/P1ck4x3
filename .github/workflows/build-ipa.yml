name: Build P1CK4X3 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Ensure build helpers are executable
        run: |
          chmod +x ipabuild.sh scripts/build_ipa.sh
          chmod +x scripts/verify_prepare_matrices.sh
          chmod +x scripts/verify_kernel_pointer_guards.sh

      - name: Build IPA
        run: ./ipabuild.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: P1CK4X3-ipa-${{ github.run_number }}
          path: build/P1CK4X3.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1CK4X3-build-log-${{ github.run_number }}
          path: build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
