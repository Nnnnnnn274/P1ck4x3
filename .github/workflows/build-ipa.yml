name: Build P1CK4X3 IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish after a successful build (leave blank to build only)
        required: false
        type: string
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Ensure build helpers are executable
        run: |
          chmod +x ipabuild.sh scripts/build_ipa.sh
          chmod +x scripts/verify_prepare_matrices.sh
          chmod +x scripts/verify_kernel_pointer_guards.sh

      - name: Build IPA
        run: ./ipabuild.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: P1CK4X3-ipa-${{ github.run_number }}
          path: build/P1CK4X3.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1CK4X3-build-log-${{ github.run_number }}
          path: build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build-ipa
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo "Release tag must start with v followed by a number: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: P1CK4X3-ipa-${{ github.run_number }}
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/P1CK4X3.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release/P1CK4X3.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "P1CK4X3 $RELEASE_TAG"
          fi
